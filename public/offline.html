<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9518ad">
<title>Offline · Moni yem</title>
<style>
  :root{--bg:#f8f5f9;--ink:#1d1421;--ink-2:#56485c;--brand:#9518ad;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#110b13;--ink:#f5eff7;--ink-2:#c3b5c9;color-scheme:dark}}
  *{box-sizing:border-box;margin:0}
  body{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
  img{width:64px;height:64px;border-radius:18px;margin-bottom:18px}
  h1{font-size:24px;letter-spacing:-.02em;margin-bottom:6px}
  p{color:var(--ink-2);max-width:32ch;margin:0 auto 20px}
  button{font:inherit;font-weight:600;height:48px;padding:0 22px;border:0;border-radius:14px;background:var(--brand);color:#fff;cursor:pointer}
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Moni yem needs a connection to load your numbers. Offline entry is coming soon.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
